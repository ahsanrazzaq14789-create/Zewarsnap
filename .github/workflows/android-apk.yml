
name: ZewarSnap Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZewarSnap_Source_Project_FIXED.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable

      - name: Check Source ZIP
        run: |
          test -f ZewarSnap_Source_Project_FIXED.zip || exit 1

      - name: Extract Project
        run: |
          mkdir -p source
          unzip -q ZewarSnap_Source_Project_FIXED.zip -d source
          test -f source/ZewarSnap/pubspec.yaml

      - name: Install Dependencies
        working-directory: source/ZewarSnap
        run: flutter pub get

      - name: Build Release APK
        working-directory: source/ZewarSnap
        run: flutter build apk --release

      - name: Verify APK Exists
        run: |
          APK="source/ZewarSnap/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK" || exit 1
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZewarSnap-APK
          path: source/ZewarSnap/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
