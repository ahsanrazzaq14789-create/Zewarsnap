name: ZewarSnap Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZewarSnap_Source_Project_FIXED.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable

      - name: Check Source ZIP
        run: |
          if [ ! -f "ZewarSnap_Source_Project_FIXED.zip" ]; then
            echo "ERROR: ZewarSnap_Source_Project_FIXED.zip not found!"
            exit 1
          fi

      - name: Extract Project
        run: |
          mkdir -p source
          unzip -q ZewarSnap_Source_Project_FIXED.zip -d source
          if [ ! -f "source/ZewarSnap/pubspec.yaml" ]; then
            echo "ERROR: Flutter project not found at source/ZewarSnap"
            find source -maxdepth 3 -name pubspec.yaml
            exit 1
          fi

      - name: Install Dependencies
        working-directory: source/ZewarSnap
        run: flutter pub get

      - name: Check Flutter Project
        working-directory: source/ZewarSnap
        run: flutter analyze --no-pub

      - name: Build Release APK
        working-directory: source/ZewarSnap
        run: flutter build apk --release

      - name: Verify APK Exists
        run: |
          APK="source/ZewarSnap/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi
          ls -lh "$APK"

      - name: Verify Android APK Signature
        continue-on-error: true
        run: |
          APK="source/ZewarSnap/build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZewarSnap-APK
          path: source/ZewarSnap/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
